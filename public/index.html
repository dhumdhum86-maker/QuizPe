<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>QuizPay - Play & Earn</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    body { -webkit-tap-highlight-color: transparent; user-select: none; }
    .custom-scroll::-webkit-scrollbar { display: none; }
  </style>
</head>
<body class="bg-slate-900 flex justify-center items-center min-h-screen text-slate-800 font-sans sm:p-4">

  <!-- Mobile Screen -->
  <div class="w-full max-w-md h-[100dvh] bg-white sm:rounded-3xl shadow-2xl flex flex-col overflow-hidden relative border border-slate-200">
    
    <!-- Top Header -->
    <header class="px-5 pt-4 pb-3 flex justify-between items-center bg-white border-b border-slate-100 z-10">
      <div class="flex items-center space-x-2">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center text-white shadow-md">
          <i class="fa-solid fa-bolt text-lg"></i>
        </div>
        <span class="font-black text-xl tracking-tight text-slate-900">Quiz<span class="text-indigo-600">Pay</span></span>
      </div>
      <div class="flex items-center space-x-1.5 bg-sky-50 border border-sky-200 px-3 py-1 rounded-full text-xs font-black text-sky-700">
        <i class="fa-solid fa-gem text-sky-500"></i>
        <span id="diamond-counter">0</span>
      </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 overflow-y-auto custom-scroll p-4 pb-20">

      <!-- ================= TAB 1: HOME ================= -->
      <div id="tab-home" class="space-y-4">
        <div class="flex items-center justify-between">
          <div>
            <p class="text-[10px] font-bold text-slate-400 uppercase">Welcome back</p>
            <h2 id="home-username" class="text-lg font-black text-slate-800">User 👋</h2>
          </div>
          <button onclick="switchTab('wallet')" class="text-xs text-indigo-600 font-bold flex items-center gap-1 hover:underline">
            Withdraw <i class="fa-solid fa-chevron-right text-[10px]"></i>
          </button>
        </div>

        <!-- Total Balance Card -->
        <div class="p-5 rounded-2xl bg-gradient-to-br from-indigo-600 via-indigo-700 to-violet-800 text-white shadow-lg relative overflow-hidden">
          <div class="relative z-10">
            <span class="text-xs font-medium text-indigo-200">Total Coins Balance</span>
            <div class="flex items-baseline gap-2 mt-1">
              <span id="coin-balance" class="text-3xl font-black">0</span>
              <span class="text-amber-300 font-bold text-sm flex items-center gap-1">
                <i class="fa-solid fa-coins"></i> Coins
              </span>
            </div>
            <p class="text-[11px] text-indigo-200 mt-2">Deducted automatically when you withdraw.</p>
          </div>
          <i class="fa-solid fa-sack-dollar absolute -bottom-3 -right-2 text-7xl text-white/10"></i>
        </div>

        <!-- Daily Streak Bonus -->
        <div class="p-3.5 rounded-2xl border border-amber-200 bg-amber-50/70 flex items-center justify-between">
          <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-amber-400 text-white flex items-center justify-center text-lg shadow-sm">
              <i class="fa-solid fa-calendar-check"></i>
            </div>
            <div>
              <h4 class="text-xs font-bold text-slate-800">Daily Streak Check-In</h4>
              <p class="text-[11px] text-slate-500">+50 free coins every 24 hours</p>
            </div>
          </div>
          <button id="checkin-btn" onclick="claimDailyCheckin()" class="px-3.5 py-1.5 rounded-lg bg-amber-500 hover:bg-amber-600 text-white text-xs font-bold transition">
            Claim
          </button>
        </div>

        <!-- 50-Question Quiz to Farm Diamonds -->
        <div class="p-3.5 rounded-2xl border border-sky-200 bg-sky-50 flex items-center justify-between">
          <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-sky-500 text-white flex items-center justify-center text-lg shadow-sm">
              <i class="fa-solid fa-graduation-cap"></i>
            </div>
            <div>
              <h4 class="text-xs font-bold text-slate-800">50-Question Quiz Pool</h4>
              <p class="text-[11px] text-slate-500">Correct answers + watch ad = <strong>+1 💎</strong></p>
            </div>
          </div>
          <button onclick="openQuizModal()" class="px-3 py-1.5 rounded-lg bg-sky-600 text-white text-xs font-bold transition">
            Play Quiz
          </button>
        </div>

        <!-- Offers Header & Quick Diamond Tool -->
        <div class="pt-2 flex justify-between items-end">
          <div>
            <h3 class
