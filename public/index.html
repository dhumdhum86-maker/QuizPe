<button onclick="document.getElementById('quiz-modal').classList.add('hidden')" class="w-7 h-7 rounded-full bg-slate-100 flex items-center justify-center text-slate-500">✕</button>
        </div>
        <div class="p-3 bg-slate-50 rounded-xl border border-slate-200">
          <p class="text-xs font-bold text-slate-800">Q1 of 50: How many states are there in India?</p>
        </div>
        <div class="space-y-2">
          <button onclick="answerQuiz(true)" class="w-full text-left p-3 rounded-xl border border-slate-200 text-xs font-bold">28 States</button>
          <button onclick="answerQuiz(false)" class="w-full text-left p-3 rounded-xl border border-slate-200 text-xs font-bold">32 States</button>
        </div>
        <div id="quiz-ad-box" class="hidden p-3 bg-sky-50 border border-sky-200 rounded-xl space-y-2 text-center">
          <p class="text-xs font-bold text-sky-900">Correct! Watch an ad to claim +1 Diamond.</p>
          <button onclick="claimQuizDiamond()" class="w-full py-2 bg-sky-600 text-white text-xs font-bold rounded-lg">Watch Ad to Claim 1 💎</button>
        </div>
      </div>
    </div>

    <!-- Ad Overlay -->
    <div id="ad-simulator" class="hidden absolute inset-0 bg-black text-white z-50 flex flex-col items-center justify-center p-6 space-y-3 text-center">
      <div class="animate-spin text-amber-400 text-4xl mb-2"><i class="fa-solid fa-spinner"></i></div>
      <h3 class="text-lg font-bold">Playing Sponsor Video Ad...</h3>
      <p id="ad-timer" class="text-xs text-slate-400">Do not close this ad</p>
    </div>

  </div>

  <script>
    let currentUser = null;

    async function apiRequest(endpoint, method = 'GET', body = null) {
      const headers = {
        'Content-Type': 'application/json',
        'x-user-email': currentUser ? currentUser.email : ''
      };
      const opts = { method, headers };
      if (body) opts.body = JSON.stringify(body);
      const res = await fetch(endpoint, opts);
      return await res.json();
    }

    async function loginUser() {
      const name = document.getElementById('login-name').value.trim();
      const email = document.getElementById('login-email').value.trim().toLowerCase();
      if (!name || !email) return alert("Fill in your name and email.");

      const data = await apiRequest('/api/auth/login', 'POST', { name, email });
      if (data && data.success) {
        currentUser = data.user;
        localStorage.setItem('quizpay_user', JSON.stringify(currentUser));
        document.getElementById('login-modal').classList.add('hidden');
        renderUI();
      }
    }

    function renderUI() {
      if (!currentUser) return;
      document.getElementById('home-username').innerText = `${currentUser.name} 👋`;
      document.getElementById('profile-name-display').innerText = currentUser.name;
      document.getElementById('profile-email-display').innerText = currentUser.email;
      document.getElementById('profile-avatar').innerText = currentUser.name.charAt(0).toUpperCase();

      document.getElementById('coin-balance').innerText = currentUser.coins.toLocaleString();
      document.getElementById('wallet-balance-display').innerText = currentUser.coins.toLocaleString();
      document.getElementById('diamond-counter').innerText = currentUser.diamonds;
    }

    function switchTab(t) {
      ['home', 'wallet', 'profile'].forEach(tab => {
        document.getElementById(`tab-${tab}`).classList.add('hidden');
        document.getElementById(`nav-btn-${tab}`).classList.replace('text-indigo-600', 'text-slate-400');
      });
      document.getElementById(`tab-${t}`).classList.remove('hidden');
      document.getElementById(`nav-btn-${t}`).classList.replace('text-slate-400', 'text-indigo-600');
    }

    async function claimDailyCheckin() {
      const data = await apiRequest('/api/daily-checkin', 'POST');
      if (data && data.success) {
        currentUser.coins = data.coins;
        renderUI();
        const btn = document.getElementById('checkin-btn');
        btn.innerText = "Claimed ✓";
        btn.disabled = true;
        btn.classList.replace('bg-amber-500', 'bg-slate-300');
        alert("🎉 +50 Coins claimed!");
      }
    }

    function openQuizModal() {
      document.getElementById('quiz-modal').classList.remove('hidden');
      document.getElementById('quiz-ad-box').classList.add('hidden');
    }
    function answerQuiz(c) {
      if (c) document.getElementById('quiz-ad-box').classList.remove('hidden');
      else alert("Incorrect! Try again.");
    }
    function claimQuizDiamond() {
      document.getElementById('quiz-modal').classList.add('hidden');
      showAdCountdown(3, async () => {
        const data = await apiRequest('/api/quiz-reward', 'POST');
        if (data && data.success) {
          currentUser.diamonds = data.diamonds;
          renderUI();
          alert("💎 +1 Diamond claimed!");
        }
      });
    }

    async function testAddDiamonds(qty) {
      for (let i = 0; i < qty; i++) await apiRequest('/api/quiz-reward', 'POST');
      const data = await apiRequest('/api/user');
      if (data && data.success) {
        currentUser = data.user;
        renderUI();
        alert(`💎 Added ${qty} Diamonds!`);
      }
    }

    async function launchAppRoadmap(appName, packageName, appIcon) {
      document.getElementById('roadmap-app-title').innerText = appName;
      document.getElementById('card-app-title').innerText = appName;
      document.getElementById('card-package-name').innerText = packageName;
      document.getElementById('roadmap-app-icon').className = `fa-solid ${appIcon}`;

      const data = await apiRequest('/api/offer/start', 'POST', { appName, packageName, appIcon });
      if (data && data.success) {
        currentUser.coins = data.newCoins;
        renderUI();
        document.getElementById('roadmap-screen').classList.remove('hidden');
      }
    }

    function closeRoadmapScreen() {
      document.getElementById('roadmap-screen').classList.add('hidden');
    }

    function submitStep2Screenshot() {
      const file = document.getElementById('step2-file-input').files[0];
      if (!file) return alert("Select a screenshot.");

      const reader = new FileReader();
      reader.onload = async (e) => {
        const data = await apiRequest('/api/offer/submit-screenshot', 'POST', { screenshotBase64: e.target.result });
        if (data && data.success) {
          document.getElementById('step2-upload-form').classList.add('hidden');
          document.getElementById('step2-pending-box').classList.remove('hidden');
          document.getElementById('step2-badge').innerText = "Pending";
          alert("✓ Screenshot submitted for review!");
        }
      };
      reader.readAsDataURL(file);
    }

    async function demoApprovePending() {
      const data = await apiRequest('/api/offer/approve-screenshot', 'POST');
      if (data && data.success) {
        currentUser.coins = data.coins;
        renderUI();
        document.getElementById('step2-pending-box').innerHTML = `<p class="text-xs font-bold text-emerald-800">Screenshot Approved! +350 Coins Added ✓</p>`;
        document.getElementById('step2-badge').innerText = "Approved ✓";
        alert("🎉 +350 Coins approved!");
      }
    }

    async function claimMilestone(key, coins, btn) {
      const data = await apiRequest('/api/offer/claim-milestone', 'POST', { milestoneKey: key });
      if (data && data.success) {
        currentUser.coins = data.coins;
        renderUI();
        btn.innerText = "Claimed ✓";
        btn.disabled = true;
        alert(`🎉 +${coins} Coins claimed!`);
      }
    }

    async function submitWithdrawal(method, amountRs, coinsRequired) {
      if (currentUser.coins < coinsRequired) return alert(`Need ${coinsRequired} coins.`);
      const dest = prompt(`Enter ${method === 'UPI' ? 'UPI ID' : 'Email'}:`);
      if (!dest) return;

      const data = await apiRequest('/api/wallet/withdraw', 'POST', { method, amountRs, coinsRequired, destination: dest });
      if (data && data.success) {
        currentUser.coins = data.newCoins;
        renderUI();
        alert(`✅ Payout of ₹${amountRs} submitted!`);
      }
    }

    function showAdCountdown(seconds, cb) {
      const ad = document.getElementById('ad-simulator');
      const timer = document.getElementById('ad-timer');
      ad.classList.remove('hidden');
      let rem = seconds;
      timer.innerText = `Reward unlocks in ${rem}s...`;
      const t = setInterval(() => {
        rem--;
        if (rem > 0) timer.innerText = `Reward unlocks in ${rem}s...`;
        else { clearInterval(t); ad.classList.add('hidden'); cb(); }
      }, 1000);
    }

    function handleSignOut() {
      if (confirm("Sign out?")) {
        localStorage.clear();
        location.reload();
      }
    }

    window.addEventListener('load', async () => {
      const saved = localStorage.getItem('quizpay_user');
      if (saved) {
        currentUser = JSON.parse(saved);
        renderUI();
        const data = await apiRequest('/api/user');
        if (data && data.success) {
          currentUser = data.user;
          renderUI();
        }
      } else {
        document.getElementById('login-modal').classList.remove('hidden');
      }
    });
  </script>
</body>
    </html>
